<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneVoice - Admin Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <style>
        .login-container {
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 0;
        }

        .login-box {
            background-color: #FFFFFF;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        .login-box h2 {
            color: #8B6F47;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 2rem;
        }

        .login-form .form-group {
            margin-bottom: 1.5rem;
        }

        .login-form label {
            display: block;
            color: #5C4A37;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .login-form input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #D4C5B9;
            border-radius: 5px;
            font-size: 1rem;
            color: #5C4A37;
            background-color: #F5F1E8;
        }

        .login-form input:focus {
            outline: none;
            border-color: #8B6F47;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background-color: #8B6F47;
            color: #F5F1E8;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #6B5637;
        }

        .error-message {
            color: #d32f2f;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        .back-to-home {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-to-home a {
            color: #8B6F47;
            text-decoration: none;
        }

        .back-to-home a:hover {
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #D4C5B9;
        }

        .divider span {
            background: #FFFFFF;
            padding: 0 1rem;
            position: relative;
            color: #5C4A37;
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>OneVoice</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="donations.html">Donations</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-box">
            <h2>Login</h2>

            <!-- Login button injected for Auth0 flow -->
            <button id="login-button" class="login-btn">Login with Auth0</button>
            <div id="errorMessage" class="error-message"></div>

            <div class="back-to-home">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Contact Section -->
    <footer class="contact-section">
        <div class="container">
            <h2>Contact Us</h2>
            <div class="contact-content">
                <div class="contact-info">
                    <div class="contact-item">
                        <h3>Location</h3>
                        <p>123 Main Street<br>City, State 12345</p>
                    </div>
                    <div class="contact-item">
                        <h3>Email</h3>
                        <p>contact@onevoice.org</p>
                    </div>
                    <div class="contact-item">
                        <h3>Phone</h3>
                        <p>(123) 456-7890</p>
                    </div>
                </div>
                <div class="social-media">
                    <h3>Follow Us</h3>
                    <div class="social-links">
                        <a href="#" class="social-link">Instagram</a>
                        <a href="#" class="social-link">Facebook</a>
                        <a href="#" class="social-link">Twitter</a>
                        <a href="#" class="social-link">LinkedIn</a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 OneVoice. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <script src="auth-config.js"></script>
    <script src="auth0-auth.js"></script>
    <script>
        // Initialize Auth0 and handle login
        window.addEventListener('DOMContentLoaded', async function () {
            // Check if already authenticated
            const isAuth = await checkAuth();
            if (isAuth) {
                const adminStatus = await isAdmin();
                if (adminStatus) {
                    window.location.href = 'admin.html';
                } else {
                    // User is authenticated but not whitelisted
                    await logout();
                    document.getElementById('errorMessage').textContent = 'Your email is not authorized to access the admin panel.';
                    document.getElementById('errorMessage').style.display = 'block';
                }
            }

            // Set up login button
            const loginButton = document.getElementById('login-button');
            if (loginButton) {
                loginButton.addEventListener('click', async function () {
                    try {
                        await login();
                    } catch (error) {
                        document.getElementById('errorMessage').textContent = 'Login failed. Please try again.';
                        document.getElementById('errorMessage').style.display = 'block';
                    }
                });
            }
        });
    </script>
</body>

</html>
